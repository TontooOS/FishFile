[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "fishfile"
version = "26.1.0"
edition = "2021"
authors = ["arlomu"]
description = "FishFile – Fish Config (.fico) parser, writer and editor for TontooOS"
license = "TCL"
repository = "https://github.com/TontooOS/FishFile"
keywords = ["tontoo", "fico", "config", "fishfile", "parser"]
categories = ["config", "parser-implementations", "encoding"]
readme = "README.md"

[dependencies]
foundation = { path = "../Foundation" }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
