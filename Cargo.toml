[lib]
crate-type = ["dylib"]

[package]
name = "fishfile"
version = "26.1.0"
edition = "2021"
authors = ["arlomu"]
description = "FishFile – Fish Config (.fico) parser, writer and editor for TontooOS"
license = "TCL"
repository = "https://github.com/TontooOS/FishFile"
keywords = ["tontoo", "fico", "config", "fishfile", "parser"]
categories = ["config", "parser-implementations", "encoding"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
